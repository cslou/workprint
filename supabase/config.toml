# Workprint-only local development; managed with Supabase CLI 2.84.2.
project_id = "workprint-sprint001"

[api]
enabled = true
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55435
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
jwt_expiry = 60
enable_signup = false
minimum_password_length = 12

[auth.email]
# Enables email/password authentication; global auth.enable_signup stays false.
enable_signup = true
enable_confirmations = false

[auth.rate_limit]
token_refresh = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[edge_runtime]
enabled = false

[analytics]
enabled = false
